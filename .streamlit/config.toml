# Tema de la interfaz (app/): la misma paleta que las figuras del informe
# (src/mineria/estilo.py). tests/test_interfaz.py comprueba que coincidan.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f7fd"
textColor = "#0b0b0b"
borderColor = "#e4e3df"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[browser]
# Sin telemetria: la app no tiene por que hablar con nadie mientras se presenta.
gatherUsageStats = false

[server]
headless = true

[client]
toolbarMode = "viewer"
